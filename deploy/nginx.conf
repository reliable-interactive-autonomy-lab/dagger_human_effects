# Alternative to the Caddy config, if your institution already runs nginx.
# The parts that matter for this app are the WebSocket upgrade headers and the
# long read timeout: a session holds one connection open for 20-30 minutes, and
# nginx's 60s default would drop it mid-task.
upstream dagger_study {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl http2;
    server_name study.example.edu;

    ssl_certificate     /etc/letsencrypt/live/study.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.example.edu/privkey.pem;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;

    location /ws/ {
        proxy_pass         http://dagger_study;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
        proxy_buffering    off;   # frames must not be held in a buffer
    }

    # Optional: keep the researcher endpoints off the public internet.
    location /admin      { allow 203.0.113.0/24; deny all; proxy_pass http://dagger_study; }
    location /api/admin/ { allow 203.0.113.0/24; deny all; proxy_pass http://dagger_study; }

    location / {
        proxy_pass       http://dagger_study;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name study.example.edu;
    return 301 https://$host$request_uri;
}
