# Study server + TLS-terminating reverse proxy.
#
#   export DAGGER_ADMIN_TOKEN=$(openssl rand -base64 24)
#   export STUDY_DOMAIN=study.example.edu
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Put the pretrained base policy in ./data/checkpoints before starting; the
# container mounts ./data read-write so sessions land on the host where
# scripts/analyze.py can read them.
services:
  study:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DAGGER_ADMIN_TOKEN: ${DAGGER_ADMIN_TOKEN:?set DAGGER_ADMIN_TOKEN}
      MUJOCO_GL: egl
      OMP_NUM_THREADS: "1"
    volumes:
      - ../data:/app/data
    command:
      - python
      - scripts/run_server.py
      - --host=0.0.0.0
      - --port=8000
      - --config=configs/study_online.yaml
      - --checkpoint=data/checkpoints/bc_rnn_Lift_study.pth
      - --max-sessions=8
      - --arms=responsive:responsive,noncontingent:noncontingent,escape:noncontingent:1:responsive
      - --completion-code=${COMPLETION_CODE:-}
      - --completion-url=${COMPLETION_URL:-}
    # One participant is one process running MuJoCo + torch. Size for roughly
    # one core per one-to-two concurrent participants and ~400 MB each.
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 6G
    expose: ["8000"]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [study]
    ports: ["80:80", "443:443"]
    environment:
      STUDY_DOMAIN: ${STUDY_DOMAIN:?set STUDY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
